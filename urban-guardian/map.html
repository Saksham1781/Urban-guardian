<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Guardian – Crime Heat Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="map.css" />
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <svg width="20" height="20" viewBox="0 0 28 28" fill="none"><path d="M14 2L4 7v8c0 5.5 4.3 10.7 10 12 5.7-1.3 10-6.5 10-12V7L14 2z" fill="url(#mlg)"/><defs><linearGradient id="mlg" x1="4" y1="2" x2="24" y2="27" gradientUnits="userSpaceOnUse"><stop stop-color="#4F6EF7"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs></svg>
      <span>Urban Guardian</span>
    </div>

    <div class="search-box">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="searchInput" placeholder="Search district or area..." />
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>

    <div class="topbar-controls">
      <button class="ctrl-btn active" id="btnZones" onclick="toggleLayer('zones')">Zones</button>
      <button class="ctrl-btn" id="btnHeat"  onclick="toggleLayer('heat')">Heat</button>
      <button class="ctrl-btn" id="btnPins"  onclick="toggleLayer('pins')">Incidents</button>
    </div>

    <a href="index.html" class="back-btn">← Back</a>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- SIDE PANEL -->
  <div class="side-panel" id="sidePanel">
    <div class="panel-header">
      <h3 id="panelTitle">District Overview</h3>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>

    <div class="panel-body" id="panelBody">
      <p class="panel-hint">Click any zone on the map to see crime details.</p>
    </div>
  </div>

  <!-- LEGEND -->
  <div class="legend">
    <div class="legend-title">Crime Risk Level</div>
    <div class="legend-item"><span class="legend-dot" style="background:#DC2626"></span> Critical</div>
    <div class="legend-item"><span class="legend-dot" style="background:#EA580C"></span> High Risk</div>
    <div class="legend-item"><span class="legend-dot" style="background:#D97706"></span> Moderate</div>
    <div class="legend-item"><span class="legend-dot" style="background:#16A34A"></span> Low Risk</div>
  </div>

  <!-- TIME FILTER -->
  <div class="time-filter">
    <div class="time-label">Time: <span id="timeLabel">12:00 PM</span></div>
    <input type="range" min="0" max="23" value="12" id="timeSlider" />
    <div class="time-presets">
      <button onclick="setHour(8)">8 AM</button>
      <button onclick="setHour(12)">12 PM</button>
      <button onclick="setHour(18)">6 PM</button>
      <button onclick="setHour(22)">10 PM</button>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-chip" id="statCritical">Critical: <strong>3</strong></div>
    <div class="stat-chip" id="statHigh">High: <strong>5</strong></div>
    <div class="stat-chip" id="statMod">Moderate: <strong>8</strong></div>
    <div class="stat-chip" id="statLow">Low: <strong>12</strong></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
